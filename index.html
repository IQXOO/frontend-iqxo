
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/Logo%20FC-01.png" />
    <link rel="apple-touch-icon" href="/Logo%20FC-01.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Theme colors -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d12" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />

    <!-- SEO -->
    <title>IQXO – AI Personal Organizer &amp; Smart Reminders</title>

    <meta
      name="description"
      content="IQXO helps you organize your life with AI. Turn voice notes, photos, and text into tasks, events, and smart reminders. Remember less, live more."
    />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IQXO – AI Personal Organizer &amp; Smart Reminders" />
    <meta
      property="og:description"
      content="IQXO turns your voice notes, photos, and text into organized tasks, events, and smart reminders. Remember less, live more."
    />
    <meta property="og:image" content="https://iqxo.ai/Logo%20FC-01.png" />
    <meta property="og:url" content="https://iqxo.ai/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IQXO – AI Personal Organizer &amp; Smart Reminders" />
    <meta
      name="twitter:description"
      content="Turn voice notes, photos, and text into tasks, events, and smart reminders with IQXO."
    />
    <meta name="twitter:image" content="https://iqxo.ai/Logo%20FC-01.png" />

    <!-- Connections -->
    <link rel="preconnect" href="https://ybpfawgukayvxorkykld.supabase.co" crossorigin />
    <link rel="preconnect" href="https://backend-iqxo.fly.dev" crossorigin />
    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />

    <!-- Fonts -->
    <link rel="preload" href="/fonts/inter-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Theme initialization -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("iqxo_theme");
          document.documentElement.className = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.className = "dark";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
